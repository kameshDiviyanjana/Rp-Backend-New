version: "3.8"

services:
  nginx:
    image: nginx:latest
    container_name: nginx-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - node-service
      - flask-service

  node-service:
    build: ./node
    image: mydockerhubuser/node:latest
    container_name: node-service
    ports:
      - "3000:3000"
    depends_on:
      - flask-service

  flask-service:
    build: ./flask
    image: mydockerhubuser/flask:latest
    container_name: flask-service
    ports:
      - "5000:5000"


