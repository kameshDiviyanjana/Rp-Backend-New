name: Deploy Python Flask API to EC2

on:
  push:
    branches: [fix/new-intigartion-all]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' | sed 's/\\n/\n/g' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Upload Flask App to EC2
        run: |
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" ./ ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/flask-api

      - name: Install Python Dependencies & Run Flask App
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            cd /home/ubuntu/flask-api

            # Install Python and pip if not installed
            sudo apt update
            sudo apt install -y python3 python3-pip python3-venv

            # Set up virtual environment
            python3 -m venv venv
            source venv/bin/activate

            # Install dependencies
            pip install -r requirements.txt

            # Kill existing process running api.py (optional)
            pkill -f api.py || true

            # Run Flask app in background
            nohup python api.py > flask.log 2>&1 &
          EOF
